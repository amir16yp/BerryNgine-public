name: Format Java Code

on: workflow_dispatch: push: branches: - "**"

permissions: contents: write

jobs: format: name: Format and Push Java Sources runs-on: ubuntu-latest


steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      token: ${{ secrets.GITHUB_TOKEN }}
      ref: ${{ github.ref }}

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Download google-java-format
    run: |
      GJF_VERSION="1.22.0"
      curl -fsSL -o /tmp/google-java-format.jar \
        "https://github.com/google/google-java-format/releases/download/v${GJF_VERSION}/google-java-format-${GJF_VERSION}-all-deps.jar"

  - name: Format all Java files
    run: |
      mapfile -t FILES < <(
        find . -type f -name '*.java' \
          ! -path './.git/*' \
          ! -path './.github/*' \
          ! -path './out/*' \
          ! -path './build/*' \
          ! -path './target/*' \
          ! -path './.idea/*' \
          | sort
      )

      if [[ ${#FILES[@]} -eq 0 ]]; then
        echo "No Java files found."
        exit 0
      fi

      echo "Formatting ${#FILES[@]} Java file(s)..."
      java -jar /tmp/google-java-format.jar --replace "${FILES[@]}"

  - name: Commit and push changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add -- '*.java'
      git add -u

      if git diff --cached --quiet; then
        echo "No formatting changes to commit."
        exit 0
      fi

      git commit -m "Format Java sources with google-java-format"
      git push origin "HEAD:${GITHUB_REF_NAME}"
