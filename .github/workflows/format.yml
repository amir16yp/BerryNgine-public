name: Format Java Code

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  format:
    name: Format and Push Java Sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download google-java-format
        shell: bash
        run: |
          GJF_VERSION="1.22.0"
          curl -fsSL \
            "https://github.com/google/google-java-format/releases/download/v${GJF_VERSION}/google-java-format-${GJF_VERSION}-all-deps.jar" \
            -o /tmp/google-java-format.jar

      - name: Format all Java files
        shell: bash
        run: |
          mapfile -d '' FILES < <(
            find . -type f -name '*.java' \
              -not -path './.git/*' \
              -not -path './out/*' \
              -not -path './build/*' \
              -not -path './target/*' \
              -not -path './.idea/*' \
              -print0
          )

          if (( ${#FILES[@]} == 0 )); then
            echo "No Java files found."
            exit 0
          fi

          echo "Formatting ${#FILES[@]} Java files."
          java -jar /tmp/google-java-format.jar --replace "${FILES[@]}"

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u

          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi

          git commit -m "Format Java sources with google-java-format"
          git push origin "HEAD:${GITHUB_REF_NAME}"
